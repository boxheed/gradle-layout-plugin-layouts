buildscript {
  repositories {
    mavenLocal()
    maven {
      url = "https://plugins.gradle.org/m2/"
    }
    maven {
      url = "https://artifacts.fizzpod.com/public/mvn/"
    }
  }
  dependencies {
    classpath 'com.fizzpod:gradle-plugin-opinion:27.1.0'
  }
}

apply plugin: 'com.fizzpod.pater-build'
apply from: 'buildSrc/build.gradle'

sourceSets {
  main {
    java {
      srcDir 'buildSrc/src/main/java'
    }
    resources {
      srcDir 'buildSrc/src/main/resources'
    }
    groovy {
      srcDir 'buildSrc/src/main/groovy'
    }
  }
  test {
    java {
      srcDir 'buildSrc/src/test/java'
    }
    resources {
      srcDir 'buildSrc/src/test/resources'
    }
    groovy {
      srcDir 'buildSrc/src/test/groovy'
    }
  }
}

dependencies {
  api gradleApi()
  api localGroovy()
}

gradlePlugin {
  plugins {
    plugin {
      description = 'TODO: Add plugin description'
      tags.set(['gradle', 'plugin'])
      id = 'com.fizzpod.todo'
      displayName = 'TODO: Add plugin display name'
      implementationClass = 'com.fizzpod.gradle.plugins.Plugin'
    }
  }
}

test {
  useJUnitPlatform()
}
